<!DOCTYPE html>
<html>
<head>
    <title>User Dashboard</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            background-image:
                linear-gradient(135deg, rgba(30, 64, 175, 0.18), rgba(14, 116, 144, 0.16)),
                linear-gradient(rgba(244, 246, 249, 0.76), rgba(244, 246, 249, 0.76)),
                url("/assets/ticket-raise-bg.svg");
            background-position: center;
            background-size: cover;
            background-attachment: fixed;
        }

        header {
            background: linear-gradient(to right, #667eea, #764ba2);
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 20px;
            position: relative;
        }

        .header-profile {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
        }

        .header-avatar {
            width: 30px;
            height: 30px;
            border-radius: 999px;
            background: #22c55e;
            color: #052e16;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            border: 1px solid rgba(255,255,255,0.45);
        }

        .header-center {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            line-height: 1.1;
            gap: 2px;
        }

        .header-brand-title {
            font-size: 38px;
            font-weight: 800;
            color: #f8fbff;
            letter-spacing: 0.2px;
        }

        .header-page-label {
            font-size: 19px;
            font-weight: 700;
            color: #eaf2ff;
        }

        .header-logout {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: #e2e8f0;
            color: #111827;
            border: none;
            border-radius: 6px;
            padding: 7px 12px;
            cursor: pointer;
            font-size: 14px;
            margin: 0;
        }

        .container {
            padding: 20px;
            max-width: 1000px;
            margin: auto;
        }

        @media (min-width: 1201px) {
            .container {
                max-width: calc(100vw - 420px);
                margin-right: 370px;
            }
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }

        .create-ticket-layout {
            display: grid;
            grid-template-columns: 1fr 1.4fr;
            gap: 14px;
            align-items: center;
        }

        .create-ticket-form {
            max-width: 680px;
            width: 100%;
            margin: 0;
            text-align: center;
            order: 2;
        }

        .create-ticket-form input,
        .create-ticket-form textarea {
            text-align: left;
        }

        .ticket-art-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 12px;
            display: grid;
            place-items: center;
            min-height: 200px;
            max-width: 380px;
            width: 100%;
            margin: 0;
            order: 1;
        }

        .ticket-art-box svg {
            width: 100%;
            max-width: 230px;
            height: auto;
        }

        @media (max-width: 900px) {
            .create-ticket-layout {
                grid-template-columns: 1fr;
            }

            .ticket-art-box,
            .create-ticket-form {
                order: initial;
                margin: 0 auto;
            }
        }

        .stats {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .stat-box {
            flex: 1;
            background: #eaf3ff;
            border: 1px solid #cfe3ff;
            color: #0f172a;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }

        button {
            padding: 10px 15px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            background: #667eea;
            color: white;
        }

        button:hover {
            opacity: 0.9;
        }

        .ticket-card {
            position: relative;
            border-left: 6px solid #3b82f6;
            border: 2px solid #93c5fd;
            padding: 15px;
            padding-right: 170px;
            margin-bottom: 15px;
            background: #fff;
            border-radius: 6px;
        }


        .date-time-box {
            position: absolute;
            right: 12px;
            top: 12px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 8px 10px;
            min-width: 130px;
            font-size: 12px;
            line-height: 1.4;
            color: #334155;
        }

        .duration-text {
            font-size: 13px;
            color: #0f172a;
            margin-top: 6px;
        }

        .search-box {
            margin-bottom: 15px;
        }

        .filter-card {
            background: white;
            border: 1px solid #cfe3ff;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 14px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.06);
        }

        .filter-grid {
            display: grid;
            grid-template-columns: 1.3fr 0.9fr 1.4fr auto;
            gap: 8px;
            align-items: end;
        }

        .filter-grid input,
        .filter-grid select {
            width: 100%;
            box-sizing: border-box;
            padding: 9px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
        }

        .filter-grid label {
            display: block;
            margin-bottom: 6px;
            font-size: 12px;
            color: #475569;
        }

        .clear-filter-btn {
            background: #334155;
            color: white;
            height: 38px;
            margin: 0;
        }

        .toast-wrap {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 9999;
        }

        .toast {
            min-width: 250px;
            padding: 12px 14px;
            border-radius: 8px;
            color: white;
            margin-bottom: 10px;
            box-shadow: 0 8px 18px rgba(0,0,0,0.2);
            font-size: 14px;
        }

        .toast.success { background: #16a34a; }
        .toast.error { background: #dc2626; }

        .status-pill {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.2px;
            color: #fff;
            vertical-align: middle;
            margin-left: 4px;
        }

        .status-none {
            background: #64748b;
            border: 1px solid #475569;
        }

        .status-open {
            background: #15803d;
            border: 1px solid #166534;
        }

        .status-progress {
            background: #c2410c;
            border: 1px solid #9a3412;
        }

        .status-closed {
            background: #b91c1c;
            border: 1px solid #991b1b;
        }

        .ticket-image {
            margin-top: 8px;
            max-width: 260px;
            max-height: 180px;
            width: auto;
            height: auto;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            display: block;
        }

        .attach-note {
            font-size: 12px;
            color: #475569;
            margin-top: -4px;
            margin-bottom: 10px;
        }

        .chat-panel {
            position: fixed;
            right: 14px;
            top: 88px;
            width: 340px;
            height: calc(100vh - 106px);
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            box-shadow: 0 10px 22px rgba(0,0,0,0.14);
            display: grid;
            grid-template-rows: auto 1fr auto;
            overflow: hidden;
            z-index: 30;
        }

        .chat-header {
            background: #0f172a;
            color: #fff;
            padding: 10px 12px;
            font-size: 14px;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-unread {
            background: #dc2626;
            color: #fff;
            border-radius: 999px;
            font-size: 11px;
            padding: 2px 8px;
        }

        .chat-messages {
            overflow: auto;
            padding: 10px;
            background: #fff;
        }

        .chat-msg {
            max-width: 82%;
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 8px;
            line-height: 1.35;
            word-break: break-word;
        }

        .chat-msg.me {
            margin-left: auto;
            background: #dbeafe;
            color: #0f172a;
            border: 1px solid #bfdbfe;
        }

        .chat-msg.other {
            margin-right: auto;
            background: #f1f5f9;
            color: #111827;
            border: 1px solid #e2e8f0;
        }

        .chat-time {
            font-size: 10px;
            color: #64748b;
            margin-top: 4px;
        }

        .chat-compose {
            border-top: 1px solid #e2e8f0;
            padding: 8px;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 6px;
            background: #fff;
        }

        .chat-compose input {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            padding: 8px;
            margin: 0;
        }

        .chat-send-btn {
            margin: 0;
            background: #2563eb;
            color: #fff;
        }

        @media (max-width: 1200px) {
            .chat-panel {
                position: static;
                width: 100%;
                height: 420px;
                margin-top: 12px;
            }

            .container {
                max-width: 1000px;
                margin-right: auto;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="header-profile">
        <span id="headerAvatar" class="header-avatar">U</span>
        <span id="headerUserName">User</span>
    </div>
    <div class="header-center">
        <div class="header-brand-title">Zealous Studio - IT Ticket System</div>
        <div class="header-page-label">User Dashboard</div>
    </div>
    <button id="logoutBtn" class="header-logout" type="button">Logout</button>
</header>

<div class="container">
    <div class="card stats">
        <div class="stat-box">
            Total<br><b id="total">0</b>
        </div>
        <div class="stat-box">
            Open<br><b id="open">0</b>
        </div>
        <div class="stat-box">
            In Progress<br><b id="progress">0</b>
        </div>
        <div class="stat-box">
            Closed<br><b id="closed">0</b>
        </div>
    </div>

    <div class="card">
        <div class="create-ticket-layout">
            <div class="create-ticket-form">
                <h3>Create New Ticket</h3>
                <select id="department" aria-label="Department">
                    <option value="">Select Department</option>
                    <option value="Roto">Roto</option>
                    <option value="Paint">Paint</option>
                    <option value="Comp">Comp</option>
                    <option value="MM">MM</option>
                    <option value="CG">CG</option>
                    <option value="Lighting">Lighting</option>
                    <option value="Moduling">Moduling</option>
                    <option value="Co-Ordinators">Co-Ordinators</option>
                    <option value="Producers">Producers</option>
                    <option value="IO">IO</option>
                    <option value="AI">AI</option>
                    <option value="Business development">Business development</option>
                    <option value="HR">HR</option>
                    <option value="Accounts">Accounts</option>
                    <option value="Others">Others</option>
                </select>
                <input id="title" placeholder="Ticket Title">
                <textarea id="description" placeholder="Describe your issue..."></textarea>
                <input id="issueImage" type="file" accept="image/*">
                <div class="attach-note">Optional image attachment (max 2 MB)</div>
                <button onclick="createTicket()">Submit Ticket</button>
            </div>
            <div class="ticket-art-box" aria-label="Ticket Illustration">
                <svg viewBox="0 0 420 280" role="img" aria-label="Ticket badge image">
                    <rect x="30" y="20" width="360" height="240" rx="14" fill="#facc15" stroke="#ca8a04" stroke-width="10"/>
                    <rect x="75" y="58" width="270" height="164" rx="12" fill="#fde047" stroke="#d97706" stroke-width="8"/>
                    <circle cx="58" cy="95" r="11" fill="#fef08a"/>
                    <circle cx="58" cy="185" r="11" fill="#fef08a"/>
                    <circle cx="362" cy="95" r="11" fill="#fef08a"/>
                    <circle cx="362" cy="185" r="11" fill="#fef08a"/>
                    <text x="210" y="145" text-anchor="middle" font-size="58" font-family="Arial, sans-serif" font-weight="700" fill="#b45309">TICKET</text>
                    <line x1="96" y1="90" x2="324" y2="90" stroke="#f59e0b" stroke-width="6"/>
                    <line x1="96" y1="190" x2="324" y2="190" stroke="#f59e0b" stroke-width="6"/>
                </svg>
            </div>
        </div>
    </div>

    <div class="filter-card">
        <div class="filter-grid">
            <div>
                <label for="search">Search</label>
                <input class="search-box" id="search" placeholder="Search title, description, comment">
            </div>
            <div>
                <label for="userFilterType">Filter By</label>
                <select id="userFilterType">
                    <option value="date">By Date</option>
                    <option value="name">By Name</option>
                    <option value="complaint">By Complaint</option>
                </select>
            </div>
            <div>
                <label for="userFilterValue">Filter Value</label>
                <input id="userFilterValue" type="date">
            </div>
            <button id="clearUserFiltersBtn" class="clear-filter-btn" type="button">Clear</button>
        </div>
    </div>

    <div class="card">
        <div id="tickets"></div>
    </div>
</div>
<div id="toastWrap" class="toast-wrap"></div>
<div id="userChatPanel" class="chat-panel">
    <div class="chat-header">
        <span>Chat With Admin</span>
        <span id="userChatUnread" class="chat-unread">0</span>
    </div>
    <div id="userChatMessages" class="chat-messages"></div>
    <div class="chat-compose">
        <input id="userChatInput" type="text" placeholder="Type message to admin">
        <button id="userChatSendBtn" class="chat-send-btn" type="button">Send</button>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
    function normalizeRole(value) {
        return String(value || "").trim().toLowerCase();
    }

    let user = null;
    try {
        user = JSON.parse(localStorage.getItem("user"));
    } catch (_) {
        user = null;
    }

    const sessionRole = normalizeRole(user && user.role);
    if (!user || !sessionRole || sessionRole === "admin") {
        localStorage.removeItem("user");
        alert("Access denied");
        location.href = "/login.html";
        return;
    }

    const userId = Number(user.id || user.user_id || user.userId || 0);
    if (!Number.isFinite(userId) || userId <= 0) {
        localStorage.removeItem("user");
        alert("Session expired. Please login again.");
        location.href = "/login.html";
        return;
    }

    let allTickets = [];
    const searchInput = document.getElementById("search");
    const userFilterTypeInput = document.getElementById("userFilterType");
    const userFilterValueInput = document.getElementById("userFilterValue");
    const clearUserFiltersBtn = document.getElementById("clearUserFiltersBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const headerAvatar = document.getElementById("headerAvatar");
    const headerUserName = document.getElementById("headerUserName");
    const userChatUnread = document.getElementById("userChatUnread");
    const userChatMessages = document.getElementById("userChatMessages");
    const userChatInput = document.getElementById("userChatInput");
    const userChatSendBtn = document.getElementById("userChatSendBtn");
    let userChatPollTimer = null;
    let userChatFirstLoad = true;
    let lastUserIncomingMessageId = 0;
    let knownUserUnread = 0;
    if (headerUserName) {
        headerUserName.textContent = `${user.username || "User"} (${sessionRole})`;
    }
    if (headerAvatar) {
        headerAvatar.textContent = String((user.username || "U").trim().charAt(0) || "U").toUpperCase();
    }
    if (logoutBtn) {
        logoutBtn.addEventListener("click", () => {
            localStorage.removeItem("user");
            location.href = "/login.html";
        });
    }

    function showToast(message, type) {
        const wrap = document.getElementById("toastWrap");
        const toast = document.createElement("div");
        toast.className = `toast ${type}`;
        toast.textContent = message;
        wrap.appendChild(toast);

        setTimeout(() => {
            toast.remove();
        }, 2500);
    }

    function escapeHtml(value) {
        return String(value || "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#39;");
    }

    async function loadUserChatUnread(showToastForNew) {
        try {
            const res = await fetch(`/chat/unread-count?role=user&userId=${encodeURIComponent(String(userId))}`);
            if (!res.ok) return;
            const data = await res.json();
            const unread = Number((data && data.unread) || 0);
            userChatUnread.textContent = String(unread);
            if (showToastForNew && unread > knownUserUnread) {
                showToast("New message from admin", "success");
            }
            knownUserUnread = unread;
        } catch (_) {}
    }

    async function loadUserChatMessages(scrollToEnd) {
        try {
            const res = await fetch(`/chat/messages?role=user&userId=${encodeURIComponent(String(userId))}`);
            if (!res.ok) return;
            const rows = await res.json();
            const messages = Array.isArray(rows) ? rows : [];
            userChatMessages.innerHTML = "";
            let maxIncomingId = lastUserIncomingMessageId;

            messages.forEach((msg) => {
                const senderRole = String(msg.sender_role || "").toLowerCase();
                const isMe = senderRole !== "admin";
                const messageId = Number(msg.id || 0);
                if (!isMe && messageId > maxIncomingId) {
                    maxIncomingId = messageId;
                }
                const item = document.createElement("div");
                item.className = `chat-msg ${isMe ? "me" : "other"}`;
                item.innerHTML = `
                    <div>${escapeHtml(msg.message)}</div>
                    <div class="chat-time">${formatDateTime(msg.createdAt)}</div>
                `;
                userChatMessages.appendChild(item);
            });

            if (!userChatFirstLoad && maxIncomingId > lastUserIncomingMessageId) {
                showToast("New message from admin", "success");
            }
            lastUserIncomingMessageId = maxIncomingId;
            userChatFirstLoad = false;

            if (scrollToEnd) {
                userChatMessages.scrollTop = userChatMessages.scrollHeight;
            }
        } catch (_) {}
    }

    async function sendUserChatMessage() {
        const text = String(userChatInput && userChatInput.value || "").trim();
        if (!text) return;
        if (userChatSendBtn) {
            userChatSendBtn.disabled = true;
        }
        try {
            const res = await fetch("/chat/messages", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    role: sessionRole,
                    userId,
                    message: text,
                }),
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
                showToast(data.error || "Unable to send chat message", "error");
                return;
            }
            userChatInput.value = "";
            await loadUserChatMessages(true);
            await loadUserChatUnread(false);
        } catch (_) {
            showToast("Unable to send chat message", "error");
        } finally {
            if (userChatSendBtn) {
                userChatSendBtn.disabled = false;
            }
        }
    }

    async function loadTickets() {
        try {
            const res = await fetch(`/tickets?role=${encodeURIComponent(user.role)}&userId=${encodeURIComponent(String(userId))}`);
            if (!res.ok) throw new Error("Failed");
            allTickets = await res.json();

            updateStats();
            applyUserFilters();
        } catch (_) {
            showToast("Unable to load tickets", "error");
        }
    }

    function updateStats() {
        document.getElementById("total").textContent = allTickets.length;
        document.getElementById("open").textContent =
            allTickets.filter(t => t.status === "Open" || t.status === "Re-Open").length;
        document.getElementById("progress").textContent =
            allTickets.filter(t => t.status === "In Progress").length;
        document.getElementById("closed").textContent =
            allTickets.filter(t => t.status === "Closed").length;
    }

function statusClassName(status) {
    const key = String(status || "").trim().toLowerCase().replace(/\s+/g, " ");
    if (key === "open" || key === "re-open" || key === "reopen") return "status-open";
    if (key === "in progress" || key === "inprocess" || key === "in process") return "status-progress";
    if (key === "closed") return "status-closed";
    return "status-none";
}

function renderTickets(tickets) {
    const container = document.getElementById("tickets");
    container.innerHTML = "";

        if (tickets.length === 0) {
            container.innerHTML = "<p>No tickets found.</p>";
            return;
        }

    tickets.forEach(t => {
        const dt = formatDateParts(t.createdAt);
        const openForDuration = t.openedAt || "";
        const totalForDuration = Number(t.totalOpenSeconds || 0);
        const statusClass = statusClassName(t.status);
        const reopenButton = t.status === "Closed"
            ? `<button class="reopen-btn" data-id="${t.id}">Re-Open</button>`
            : "";
        const imageBlock = t.imageData
            ? `<img class="ticket-image" src="${t.imageData}" alt="Ticket attachment">`
            : "";
        container.innerHTML += `
            <div class="ticket-card">
                <div class="date-time-box">
                    <div><b>Date:</b> ${dt.date}</div>
                    <div><b>Time:</b> ${dt.time}</div>
                    <div><b>Open Time:</b> ${formatDateTime(t.openedAt)}</div>
                    <div><b>Close Time:</b> ${formatDateTime(t.closedAt)}</div>
                    <div><b>Duration:</b> <span class="duration-value" data-total="${totalForDuration}" data-open="${openForDuration}">${formatDuration(totalForDuration, openForDuration)}</span></div>
                </div>
                <h4>${t.title}</h4>
                <p><b>Complaint No:</b> ${t.complaintNo || String(t.id || "").padStart(5, "0")}</p>
                <p><b>Department:</b> ${t.department || "Others"}</p>
                <p>${t.description}</p>
                ${imageBlock}
                <p><b>Status:</b> <span class="status-pill ${statusClass}">${t.status}</span></p>
                <p><b>Admin Comment:</b> ${t.comment || "No comment yet"}</p>
                ${reopenButton}
            </div>
        `;
    });

    startLiveDurationUpdates();

    document.querySelectorAll(".reopen-btn").forEach((btn) => {
        btn.addEventListener("click", async () => {
            const id = btn.getAttribute("data-id");
            if (!id) return;
            await reopenTicket(id);
        });
    });
}

function formatDateParts(isoValue) {
    if (!isoValue) return { date: "-", time: "-" };
    const date = new Date(isoValue);
    if (Number.isNaN(date.getTime())) return { date: String(isoValue), time: "-" };
    return {
        date: date.toLocaleDateString(),
        time: date.toLocaleTimeString()
    };
}

function formatDateTime(isoValue) {
    if (!isoValue) return "-";
    const d = new Date(isoValue);
    if (Number.isNaN(d.getTime())) return String(isoValue);
    return d.toLocaleString();
}

function localDateInputValue(isoValue) {
    if (!isoValue) return "";
    const d = new Date(isoValue);
    if (Number.isNaN(d.getTime())) return "";
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
}

function formatDuration(totalOpenSeconds, openedAtIso) {
    let totalSeconds = Number(totalOpenSeconds || 0);
    if (openedAtIso) {
        const start = new Date(openedAtIso).getTime();
        const now = Date.now();
        if (!Number.isNaN(start) && now > start) {
            totalSeconds += Math.floor((now - start) / 1000);
        }
    }
    if (totalSeconds <= 0) return "-";

    const totalMinutes = Math.floor(totalSeconds / 60);
    const days = Math.floor(totalMinutes / 1440);
    const hours = Math.floor((totalMinutes % 1440) / 60);
    const minutes = totalMinutes % 60;
    const seconds = totalSeconds % 60;
    const runningTag = openedAtIso ? " (running)" : "";
    return `${days}d ${hours}h ${minutes}m ${seconds}s${runningTag}`;
}

let durationTimer = null;
function startLiveDurationUpdates() {
    if (durationTimer) {
        clearInterval(durationTimer);
    }

    const tick = () => {
        document.querySelectorAll(".duration-value").forEach((el) => {
            const total = Number(el.getAttribute("data-total") || "0");
            const open = el.getAttribute("data-open");
            el.textContent = formatDuration(total, open);
        });
    };

    tick();
    durationTimer = setInterval(tick, 1000);
}

function readImageAsDataUrl(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || ""));
        reader.onerror = () => reject(new Error("Unable to read image"));
        reader.readAsDataURL(file);
    });
}

    window.createTicket = async function () {
        const title = document.getElementById("title").value.trim();
        const description = document.getElementById("description").value.trim();
        const department = document.getElementById("department").value.trim();
        const imageInput = document.getElementById("issueImage");
        const selectedFile = imageInput && imageInput.files ? imageInput.files[0] : null;

        if (!department || !title || !description) {
            showToast("Please fill all fields", "error");
            return;
        }

        if (selectedFile && selectedFile.size > 2 * 1024 * 1024) {
            showToast("Image size must be 2 MB or less", "error");
            return;
        }

        let imageData = null;
        if (selectedFile) {
            try {
                imageData = await readImageAsDataUrl(selectedFile);
            } catch (_) {
                showToast("Unable to read selected image", "error");
                return;
            }
        }

        try {
            const res = await fetch("/tickets", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    title,
                    description,
                    department,
                    user_id: userId,
                    imageData
                })
            });

            if (!res.ok) {
                showToast("Failed to create ticket. Try again.", "error");
                return;
            }
            const payload = await res.json().catch(() => ({}));

            document.getElementById("title").value = "";
            document.getElementById("description").value = "";
            document.getElementById("department").value = "";
            if (imageInput) {
                imageInput.value = "";
            }
            const ticketNo = payload && payload.complaintNo ? ` #${payload.complaintNo}` : "";
            showToast(`Ticket created successfully${ticketNo}.`, "success");
            loadTickets();
        } catch (_) {
            showToast("Network error while creating ticket", "error");
        }
    };

    async function reopenTicket(ticketId) {
        try {
            const res = await fetch(`/tickets/${ticketId}/reopen`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ userId })
            });

            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
                showToast(data.error || "Unable to re-open ticket", "error");
                return;
            }

            showToast("Ticket re-opened", "success");
            loadTickets();
        } catch (_) {
            showToast("Unable to re-open ticket", "error");
        }
    }

    function applyUserFilters() {
        const search = String(searchInput && searchInput.value || "").trim().toLowerCase();
        const filterType = String(userFilterTypeInput && userFilterTypeInput.value || "date");
        const filterValue = String(userFilterValueInput && userFilterValueInput.value || "").trim().toLowerCase();

        const filtered = allTickets.filter((t) => {
            const searchTarget = `${t.title || ""} ${t.description || ""} ${t.comment || ""}`.toLowerCase();
            const ticketName = String(t.username || user.username || "").toLowerCase();
            const complaintText = String(t.description || "").toLowerCase();
            const matchesSearch = !search || searchTarget.includes(search);
            if (!filterValue) return matchesSearch;

            if (filterType === "date") {
                return matchesSearch && localDateInputValue(t.createdAt) === filterValue;
            }
            if (filterType === "name") {
                return matchesSearch && ticketName.includes(filterValue);
            }
            if (filterType === "complaint") {
                return matchesSearch && complaintText.includes(filterValue);
            }
            return matchesSearch;
        });

        renderTickets(filtered);
    }

    function syncUserFilterInputMode() {
        const mode = String(userFilterTypeInput && userFilterTypeInput.value || "date");
        if (!userFilterValueInput) return;
        if (mode === "date") {
            userFilterValueInput.type = "date";
            userFilterValueInput.placeholder = "";
        } else if (mode === "name") {
            userFilterValueInput.type = "text";
            userFilterValueInput.placeholder = "Enter name";
        } else {
            userFilterValueInput.type = "text";
            userFilterValueInput.placeholder = "Enter complaint text";
        }
        userFilterValueInput.value = "";
        applyUserFilters();
    }

    window.filterTickets = applyUserFilters;

    [searchInput, userFilterValueInput].forEach((el) => {
        if (!el) return;
        el.addEventListener("input", applyUserFilters);
    });
    if (userFilterTypeInput) {
        userFilterTypeInput.addEventListener("change", syncUserFilterInputMode);
    }
    if (clearUserFiltersBtn) {
        clearUserFiltersBtn.addEventListener("click", () => {
            if (searchInput) searchInput.value = "";
            if (userFilterTypeInput) userFilterTypeInput.value = "date";
            syncUserFilterInputMode();
            if (userFilterValueInput) userFilterValueInput.value = "";
            applyUserFilters();
        });
    }
    if (userChatSendBtn) {
        userChatSendBtn.addEventListener("click", sendUserChatMessage);
    }
    if (userChatInput) {
        userChatInput.addEventListener("keydown", (event) => {
            if (event.key === "Enter") {
                sendUserChatMessage();
            }
        });
    }
    syncUserFilterInputMode();

    function startUserPolling() {
        if (userChatPollTimer) {
            clearInterval(userChatPollTimer);
        }
        userChatPollTimer = setInterval(async () => {
            await loadTickets();
            await loadUserChatMessages(false);
            await loadUserChatUnread(true);
        }, 5000);
    }

loadTickets();
loadUserChatMessages(true);
loadUserChatUnread(false);
startUserPolling();
});
