<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - IT Ticket System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .login-card {
            background: white;
            padding: 36px;
            border-radius: 10px;
            width: min(520px, 92vw);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 8px;
        }

        p {
            color: #334155;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .actions {
            display: grid;
            grid-template-columns: repeat(2, minmax(160px, 1fr));
            gap: 12px;
        }

        a {
            display: block;
            text-decoration: none;
            color: white;
            background: #1d4ed8;
            padding: 12px 14px;
            border-radius: 8px;
            font-weight: 600;
        }

        a.user {
            background: #0f766e;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>IT Ticket System</h2>
        <p>Select login type</p>
        <div class="actions">
            <a href="/admin-login.html">Admin Login</a>
            <a class="user" href="/user-login.html">User Login</a>
        </div>
    </div>
</body>
</html>
